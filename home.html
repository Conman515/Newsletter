<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Leaky Wader - Home</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles/base.css">
  <style>
    main {
      text-align: center;
      position: relative;
    }

    main::before {
      content: "";
      position: absolute;
      inset: -35% -30% -35% -30%;
      background: radial-gradient(circle at 50% 20%, rgba(58, 167, 163, 0.18), transparent 55%),
        radial-gradient(circle at 10% 90%, rgba(219, 166, 118, 0.16), transparent 60%);
      z-index: 0;
    }

    main > * {
      position: relative;
      z-index: 1;
    }

    .card-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: clamp(1.25rem, 2.5vw, 2rem);
      margin: clamp(1.25rem, 2.5vw, 2rem) auto;
      padding: clamp(1.25rem, 3.5vw, 2.25rem) clamp(1.15rem, 3.5vw, 2.25rem);
      align-items: stretch;
      max-width: min(100%, 860px);
    }

    .card {
      background: linear-gradient(160deg, rgba(255, 255, 255, 0.94), rgba(236, 247, 249, 0.9));
      color: var(--navy-700);
      text-decoration: none;
      border-radius: 26px;
      overflow: hidden;
      box-shadow: 0 18px 36px rgba(31, 44, 61, 0.14);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      border: 1px solid rgba(60, 80, 105, 0.08);
      padding: clamp(1.35rem, 3vw, 2.1rem);
      display: grid;
      grid-template-rows: minmax(180px, 1fr) auto auto;
      gap: 1.25rem;
      align-items: center;
      justify-items: center;
      text-align: center;
      position: relative;
      isolation: isolate;
    }

    .card::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: linear-gradient(135deg, rgba(58, 167, 163, 0.18), rgba(219, 166, 118, 0.18));
      opacity: 0;
      transition: opacity 0.3s ease;
      z-index: -1;
    }

    .card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 18px;
      box-shadow: 0 18px 40px -24px rgba(15, 30, 45, 0.35);
      transition: transform 0.45s ease;
    }

    .card h2 {
      margin: 0;
      font-size: 1.75rem;
      color: var(--navy-900);
      font-family: var(--font-heading);
      letter-spacing: -0.01em;
    }

    .card p {
      margin: 0;
      color: var(--text-muted);
      font-size: 1.05rem;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }

    .card:hover {
      transform: translateY(-6px);
      box-shadow: 0 24px 40px rgba(58, 167, 163, 0.25);
    }

    .card:hover img {
      transform: scale(1.05);
    }

    .card:hover::after {
      opacity: 1;
    }

    @media (max-width: 700px) {
      .card-container {
        margin: clamp(1rem, 5vw, 1.75rem) auto;
        padding: clamp(1.25rem, 5vw, 2rem) clamp(1rem, 6vw, 1.75rem);
      }
    }
  </style>
</head>
<body>
  <div class="page-shell">
    <header>
      <div class="logo">The Leaky Wader</div>
      <div class="hamburger" id="hamburger"><span></span><span></span><span></span></div>
      <nav>
        <ul class="nav-links" id="nav-links">
          <li><a href="home.html">Home</a></li>
          <li class="has-submenu">
            <div class="submenu-header">
              <a href="newsletter.html">Newsletter</a>
              <button class="submenu-toggle" aria-expanded="false" aria-label="Toggle Newsletter submenu">
                <span class="chevron" aria-hidden="true">&#9662;</span>
              </button>
            </div>
            <ul class="submenu">
              <li><a href="issues/DecJan2025/DecJan2025Newsletter.html">Dec 2024 &ndash; Jan 2025</a></li>
              <li><a href="issues/April2025/MarchApril2025Newsletter.html">Mar &ndash; Apr 2025</a></li>
              <li><a href="issues/May2025/May2025Newsletter.html">May 2025</a></li>
              <li><a href="issues/June2025/June2025Newsletter.html">June 2025</a></li>
              <li><a href="issues/August2025/JulyAugust2025Newsletter.html">Jul &ndash; Aug 2025</a></li>
              <li><a href="issues/October2025/SeptemberOctober2025Newsletter.html">Sep &ndash; Oct 2025</a></li>
            </ul>
          </li>
          <li><a href="reports.html">Reports</a></li>
        </ul>
      </nav>
    </header>
    <main>
      <div class="card-container">
        <a href="newsletter.html" class="card">
          <img src="issues/June2025/Gold-Creek-Pond.jpg" alt="Gold Creek Pond">
          <h2>Newsletter</h2>
          <p>Monthly updates and stories</p>
        </a>
        <a href="reports.html" class="card">
          <img src="assets/reports/2024-th.png" alt="Reports">
          <h2>Reports</h2>
          <p>Detailed reports and findings</p>
        </a>
      </div>
    </main>
    <footer>Created by <a href="https://conman515.github.io/ConnorCunningham_CV/">Connor Cunningham</a> 2025</footer>
  </div>
  <script src="fade.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const hamburger = document.getElementById('hamburger');
      const navLinks = document.getElementById('nav-links');
      const submenuToggles = document.querySelectorAll('.submenu-toggle');

      if (hamburger) {
        hamburger.addEventListener('click', function() {
          navLinks.classList.toggle('show');
        });
      }

      submenuToggles.forEach(function(toggle) {
        toggle.addEventListener('click', function() {
          const parentItem = toggle.closest('.has-submenu');
          const submenu = parentItem ? parentItem.querySelector('.submenu') : null;
          const expanded = toggle.getAttribute('aria-expanded') === 'true';
          toggle.setAttribute('aria-expanded', String(!expanded));
          if (submenu) {
            submenu.classList.toggle('show', !expanded);
          }
        });
      });

      document.querySelectorAll('.nav-links a').forEach(function(link) {
        link.addEventListener('click', function() {
          navLinks.classList.remove('show');
          submenuToggles.forEach(function(toggle) {
            toggle.setAttribute('aria-expanded', 'false');
            const parentItem = toggle.closest('.has-submenu');
            const submenu = parentItem ? parentItem.querySelector('.submenu') : null;
            if (submenu) {
              submenu.classList.remove('show');
            }
          });
        });
      });
    });
  </script>
</body>
</html>
