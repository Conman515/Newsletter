<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Leaky Wader</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <style>
    html, body {
      height: 100%;
      margin: 0;
    }
    body {
      font-family: 'Playfair Display', serif;
      background: #a0acbd;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      opacity: 0;
      transition: opacity 2s ease-in-out;
    }
    body.fade-in { opacity: 1; }
    body.fade-out { opacity: 0; }
        .hero {
          position: relative;
          color: #fff;
          background: url('assets/hero/Gyokatsu.png') center center / cover no-repeat;
          min-height: 100vh;
          width: 100%;
          display: flex;
          align-items: center;
          justify-content: center;
          box-sizing: border-box;
          padding: 3.5rem 2rem;
          overflow: hidden;
          text-align: center;
        }
        .hero::before {
          content: "";
          position: absolute;
          inset: 0;
          background: linear-gradient(120deg, rgba(10, 23, 46, 0.82), rgba(10, 23, 46, 0.45));
          mix-blend-mode: multiply;
        }
        .hero__content {
          position: relative;
          z-index: 1;
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 1.5rem;
        }
        .title {
          font-size: clamp(4rem, 10vw, 15rem);
          margin: 0;
          line-height: 1.1;
          text-shadow: 0 8px 18px rgba(0, 0, 0, 0.35);
        }
      .title span {
        display: block;
        padding: 0;
        margin: 0;
        transform: translateY(-150px);
        opacity: 0;
        animation: drop 0.9s forwards ease-in;
      }
      .title span:nth-child(2) { animation-delay: 0.15s; }
      .title span:nth-child(3) { animation-delay: 0.3s; }
      @keyframes drop {
        0% {
          transform: translateY(-150px);
          opacity: 0;
        }
        60% {
          transform: translateY(20px);
          opacity: 1;
        }
        80% {
          transform: translateY(-10px);
        }
        100% {
          transform: translateY(0);
          opacity: 1; /* Keep title visible after animation */
        }
      }
      .cta {
        display: inline-block;
        padding: 0.75em 2.25em;
        background: rgba(76, 126, 176, 0.9);
        color: #fff;
        text-decoration: none;
        font-size: 1.25rem;
        border-radius: 999px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        transition: background 0.3s, transform 0.3s;
        text-shadow: 0 4px 12px rgba(0, 0, 0, 0.3);
      }
      .cta:hover {
        background: #e09f1f;
        transform: translateY(-3px) scale(1.05);
      }
    @media (max-width: 600px) {
      .hero{
        justify-content:flex-start;
        padding:3rem 1.5rem 2.5rem;
      }
      .hero__content{gap:1.25rem;}
      .title {
        font-size: 2.5rem;
        text-shadow: 0 5px 14px rgba(0, 0, 0, 0.35);
      }
      .cta {
        font-size: 1rem;
        padding: 0.65em 1.75em;
      }
    }
  </style>
</head>
<body>
  <div class="hero">
    <div class="hero__content">
      <h1 class="title">
        <span>The</span>
        <span>Leaky</span>
        <span>Wader</span>
      </h1>
      <a href="home.html" class="cta">Enter</a>
    </div>
  </div>
  <script src="fade.js"></script>
</body>
</html>
