<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Leaky Wader</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --font-heading: 'Playfair Display', serif;
      --font-body: 'Source Sans 3', sans-serif;
    :root{
      --bg-gradient: linear-gradient(180deg,#f7f9fc,#eef2f7);
      --navy-900:#1f2c3d;
      --navy-700:#2c3e55;
      --navy-500:#3f526b;
      --copper-500:#c37a47;
      --copper-300:#dba676;
      --surface:#ffffff;
      --surface-soft:rgba(255,255,255,0.82);
      --text-primary:#1f2c3d;
      --shadow-elevated:0 35px 65px rgba(31,44,61,0.18);
    }
    html, body {
      height: 100%;
      margin: 0;
    }
    html{background:var(--bg-gradient);}
    body {
      font-family: var(--font-body);
      background: #a0acbd;
      font-family: 'Playfair Display', serif;
      background: var(--bg-gradient);
      color: var(--surface);
      display: flex;
      justify-content: center;
      align-items: stretch;
      min-height: 100%;
      text-align: center;
      opacity: 0;
      transition: opacity 2s ease-in-out;
      padding: clamp(1.5rem,4vw,3rem) clamp(1rem,3vw,2rem);
      box-sizing: border-box;
    }
    body.fade-in { opacity: 1; }
    body.fade-out { opacity: 0; }
    .page-shell{
      width:100%;
      max-width:1200px;
      margin:0 auto;
      display:flex;
      flex-direction:column;
      justify-content:center;
      flex:1;
    }
    .hero {
      color: var(--surface);
      background: url('assets/hero/Gyokatsu.png') center center / cover no-repeat;
      min-height: calc(100vh - clamp(6rem,10vw,10rem));
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      padding: clamp(2rem,5vw,4rem);
      border-radius: clamp(24px,4vw,40px);
      position: relative;
      overflow: hidden;
      box-shadow: var(--shadow-elevated);
      isolation: isolate;
    }
    .hero::before{
      content:"";
      position:absolute;
      inset:0;
      background:linear-gradient(135deg,rgba(31,44,61,0.78),rgba(195,122,71,0.45));
      mix-blend-mode: multiply;
      z-index:-1;
    }
        .hero {
          position: relative;
          color: #fff;
          background: url('assets/hero/Gyokatsu.png') center center / cover no-repeat;
          min-height: 100vh;
          width: 100%;
          display: flex;
          align-items: center;
          justify-content: center;
          box-sizing: border-box;
          padding: 3.5rem 2rem;
          overflow: hidden;
          text-align: center;
        }
        .hero::before {
          content: "";
          position: absolute;
          inset: 0;
          background: linear-gradient(120deg, rgba(10, 23, 46, 0.82), rgba(10, 23, 46, 0.45));
          mix-blend-mode: multiply;
        }
        .hero__content {
          position: relative;
          z-index: 1;
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 1.5rem;
        }
        .title {
          font-size: clamp(4rem, 10vw, 15rem);
          margin: 0;
          line-height: 1.1;
          font-family: var(--font-heading);
          letter-spacing: -0.02em;
          text-shadow: 0 8px 18px rgba(0, 0, 0, 0.35);
        }
      .title span {
        display: block;
        padding: 0;
        margin: 0;
        transform: translateY(-150px);
        opacity: 0;
        animation: drop 0.9s forwards ease-in;
      }
      .title span:nth-child(2) { animation-delay: 0.15s; }
      .title span:nth-child(3) { animation-delay: 0.3s; }
      @keyframes drop {
        0% {
          transform: translateY(-150px);
          opacity: 0;
        }
        60% {
          transform: translateY(20px);
          opacity: 1;
        }
        80% {
          transform: translateY(-10px);
        }
        100% {
          transform: translateY(0);
          opacity: 1; /* Keep title visible after animation */
        }
      }
      .cta {
        display: inline-block;
        margin-top: 1.5rem;
        padding: 0.85em 2.5em;
        background: rgba(44,62,85,0.82);
        color: var(--surface);
        text-decoration: none;
        font-size: 1.2rem;
        border-radius: 999px;
        border:1px solid rgba(255,255,255,0.35);
        letter-spacing:0.04em;
        text-transform:uppercase;
        font-weight:600;
        transition: background 0.3s ease, transform 0.3s ease, box-shadow 0.3s ease;
        box-shadow:0 16px 30px rgba(31,44,61,0.2);
        padding: 0.75em 2.25em;
        background: rgba(76, 126, 176, 0.9);
        color: #fff;
        text-decoration: none;
        font-size: 1.25rem;
        border-radius: 999px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        transition: background 0.3s, transform 0.3s;
        font-family: var(--font-body);
        text-shadow: 0 4px 12px rgba(0, 0, 0, 0.3);
      }
      .cta:hover {
        background: var(--copper-500);
        transform: translateY(-3px) scale(1.05);
        box-shadow:0 22px 40px rgba(195,122,71,0.35);
      }
      .cta:focus-visible{
        outline:none;
        box-shadow:0 0 0 4px rgba(219,166,118,0.45);
      }
    @media (max-width: 600px) {
      body{padding:1.5rem;}
      .hero{padding:2rem;min-height:75vh;}
      .hero{
        justify-content:flex-start;
        padding:3rem 1.5rem 2.5rem;
      }
      .hero__content{gap:1.25rem;}
      .title {
        font-size: 2.25rem;
        font-size: 2.5rem;
        text-shadow: 0 5px 14px rgba(0, 0, 0, 0.35);
      }
      .cta {
        font-size: 1rem;
        padding: 0.65em 1.75em;
      }
    }
  </style>
</head>
<body>
  <div class="page-shell">
  <div class="hero">
    <div class="hero__content">
      <h1 class="title">
        <span>The</span>
        <span>Leaky</span>
        <span>Wader</span>
      </h1>
      <a href="home.html" class="cta">Enter</a>
    </div>
  </div>
  </div>
  <script src="fade.js"></script>
</body>
</html>
