<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reports</title>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg-gradient: linear-gradient(180deg,#f7f9fc,#eef2f7);
      --navy-900:#1f2c3d;
      --navy-700:#2c3e55;
      --navy-500:#3f526b;
      --navy-200:#d5dde8;
      --copper-500:#c37a47;
      --copper-300:#dba676;
      --copper-200:#f0d9c6;
      --surface:#ffffff;
      --surface-soft:rgba(255,255,255,0.82);
      --shadow-soft:0 25px 55px rgba(31,44,61,0.12);
      --focus-ring:0 0 0 3px rgba(219,166,118,0.5);
      --text-muted:#5a6c7f;
    }
    html{height:100%;background:var(--bg-gradient);}
    body{margin:0;font-family:'Newsreader',serif;background:var(--bg-gradient);color:var(--navy-900);display:flex;justify-content:center;align-items:stretch;min-height:100vh;opacity:0;transition:opacity 0.5s ease-in-out;padding:clamp(1.5rem,4vw,3rem) clamp(1.5rem,4vw,3rem);box-sizing:border-box;}
    body.fade-in{opacity:1;}
    body.fade-out{opacity:0;}
    .page-shell{width:100%;max-width:1200px;margin:0 auto;display:flex;flex-direction:column;gap:clamp(1.5rem,3vw,2.5rem);}
    header{background:radial-gradient(circle at top left,rgba(31,44,61,0.85),rgba(31,44,61,0.55));color:var(--surface);display:flex;align-items:center;justify-content:space-between;padding:1rem clamp(1.25rem,3vw,2rem);border-radius:20px;border:1px solid rgba(255,255,255,0.35);box-shadow:0 22px 45px rgba(31,44,61,0.18);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);position:relative;}
    header .logo{display:flex;align-items:center;font-weight:700;font-size:1.4rem;letter-spacing:0.02em;}
    nav{position:relative;}
    .nav-links{list-style:none;display:flex;margin:0;padding:0;align-items:center;gap:0.25rem;}
    .nav-links li{position:relative;}
    .nav-links>li>a,.submenu-header>a{display:block;padding:0.6em 1.1em;border-radius:999px;color:rgba(255,255,255,0.92);text-decoration:none;transition:color 0.3s ease,background 0.3s ease,box-shadow 0.3s ease;}
    .nav-links>li>a:hover,.nav-links>li>a:focus-visible,.submenu-header>a:hover,.submenu-header>a:focus-visible,.submenu-toggle:hover,.submenu-toggle:focus-visible{color:var(--copper-200);background:rgba(255,255,255,0.12);outline:none;box-shadow:0 8px 18px rgba(219,166,118,0.25);}
    .submenu-header{display:flex;align-items:center;}
    .submenu-header>a{flex:1;}
    .submenu-toggle{display:flex;align-items:center;justify-content:center;background:transparent;border:none;color:rgba(255,255,255,0.92);padding:0.6em 0.75em;margin-left:0.25rem;border-radius:999px;cursor:pointer;transition:color 0.3s ease,background 0.3s ease,box-shadow 0.3s ease;}
    .submenu-toggle .chevron{font-size:0.75rem;transition:transform 0.3s ease;}
    .submenu-toggle[aria-expanded="true"] .chevron{transform:rotate(180deg);}
    .hamburger{display:none;flex-direction:column;cursor:pointer;gap:6px;}
    .hamburger span{height:3px;width:26px;border-radius:999px;background:rgba(255,255,255,0.92);}
    .submenu{position:absolute;left:0;top:100%;background:rgba(31,44,61,0.95);list-style:none;padding:0.5em;margin:0;min-width:230px;border-radius:18px;border:1px solid rgba(195,122,71,0.35);box-shadow:0 18px 32px rgba(31,44,61,0.28);display:none;backdrop-filter:blur(6px);}
    .submenu li a{display:block;padding:0.55em 1.1em;border-radius:12px;color:rgba(255,255,255,0.9);text-decoration:none;font-size:0.95rem;transition:background 0.3s ease,color 0.3s ease;}
    .submenu li a:hover,.submenu li a:focus-visible{background:rgba(195,122,71,0.22);color:#fff;outline:none;}
    .submenu.show{display:block;}
    @media(min-width:701px){.has-submenu:hover .submenu{display:block;}}
    @media(max-width:700px){
      header{align-items:flex-start;}
      nav{width:100%;}
      .nav-links{position:absolute;right:0;top:calc(100% + 0.5rem);background:rgba(31,44,61,0.97);flex-direction:column;width:min(260px,90vw);display:none;border-radius:20px;padding:0.75rem;border:1px solid rgba(195,122,71,0.3);box-shadow:0 18px 32px rgba(31,44,61,0.28);}
      .nav-links.show{display:flex;}
      .nav-links>li>a,.submenu-header>a{width:100%;border-radius:14px;text-align:left;}
      .submenu{position:static;width:100%;padding:0.4rem;margin-top:0.25rem;border-radius:14px;border:1px solid rgba(195,122,71,0.2);box-shadow:none;}
      .submenu li a{padding-left:2.1em;}
      .submenu-toggle{margin-left:auto;}
      .hamburger{display:flex;margin-top:0.5rem;}
    }
    main{flex:1;background:var(--surface);border-radius:28px;box-shadow:var(--shadow-soft);padding:clamp(2.75rem,5vw,3.75rem) clamp(1.5rem,4vw,3.75rem);text-align:center;display:flex;flex-direction:column;gap:2.5rem;}
    main h1{margin:0;font-size:clamp(2.4rem,4vw,3rem);color:var(--navy-900);}
    .report-grid{display:flex;flex-wrap:wrap;gap:24px;justify-content:center;}
    .report-card{background:linear-gradient(180deg,#ffffff,rgba(242,246,252,0.92));color:var(--navy-700);text-decoration:none;border-radius:20px;overflow:hidden;box-shadow:0 14px 30px rgba(31,44,61,0.12);transition:transform 0.3s ease,box-shadow 0.3s ease;border:1px solid rgba(60,80,105,0.08);width:240px;padding:1.25em;display:flex;flex-direction:column;gap:0.85rem;align-items:center;}
    .report-card img{width:100%;height:140px;object-fit:cover;border-radius:14px;}
    .report-card span{margin:0;font-weight:600;font-size:1.35rem;color:var(--navy-900);text-align:center;}
    .report-card:hover{transform:translateY(-6px);box-shadow:0 24px 40px rgba(195,122,71,0.28);}
    @media(max-width:600px){
      .report-card{flex-basis:100%;width:100%;}
      .report-card span{font-size:1.2rem;}
    }
    footer{text-align:center;color:var(--text-muted);font-size:0.95rem;}
    footer a{color:var(--navy-700);text-decoration:none;font-weight:600;}
    footer a:hover,footer a:focus-visible{color:var(--copper-500);outline:none;}
  </style>
</head>
<body>
  <div class="page-shell">
  <header>
    <div class="logo">
      The Leaky Wader
    </div>
    <div class="hamburger" id="hamburger">
      <span></span><span></span><span></span>
    </div>
    <nav>
      <ul class="nav-links" id="nav-links">
        <li><a href="home.html">Home</a></li>
        <li class="has-submenu">
          <div class="submenu-header">
            <a href="newsletter.html">Newsletter</a>
            <button class="submenu-toggle" aria-expanded="false" aria-label="Toggle Newsletter submenu">
              <span class="chevron" aria-hidden="true">&#9662;</span>
            </button>
          </div>
          <ul class="submenu">
            <li><a href="issues/DecJan2025/DecJan2025Newsletter.html">Dec 2024 &ndash; Jan 2025</a></li>
            <li><a href="issues/April2025/MarchApril2025Newsletter.html">Mar &ndash; Apr 2025</a></li>
            <li><a href="issues/May2025/May2025Newsletter.html">May 2025</a></li>
            <li><a href="issues/June2025/June2025Newsletter.html">June 2025</a></li>
            <li><a href="issues/August2025/JulyAugust2025Newsletter.html">Jul &ndash; Aug 2025</a></li>
            <li><a href="issues/October2025/SeptemberOctober2025Newsletter.html">Sep &ndash; Oct 2025</a></li>
          </ul>
        </li>
        <li><a href="reports.html">Reports</a></li>
      </ul>
    </nav>
  </header>
  <main>
    <h1>Reports</h1>
    <div class="report-grid">
      <a class="report-card" href="assets/reports/yakima-basin-bull-trout-transport-project-2024.docx" download>
        <img loading="lazy" src="assets/reports/2024-th.png" alt="2024 Transport &amp; Hauling Report">
        <span>Bull Trout Transport Project 2024</span>
      </a>
    </div>
  </main>
  <footer>Created by <a href="https://conman515.github.io/ConnorCunningham_CV/">Connor Cunningham</a> 2025</footer>
  </div>
  <script src="fade.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function(){
      const hamburger = document.getElementById('hamburger');
      const navLinks = document.getElementById('nav-links');
      const submenuToggles = document.querySelectorAll('.submenu-toggle');
      if(hamburger){
        hamburger.addEventListener('click', function(){
          navLinks.classList.toggle('show');
        });
      }
      submenuToggles.forEach(function(toggle){
        toggle.addEventListener('click', function(){
          const parentItem = toggle.closest('.has-submenu');
          const submenu = parentItem ? parentItem.querySelector('.submenu') : null;
          const expanded = toggle.getAttribute('aria-expanded') === 'true';
          toggle.setAttribute('aria-expanded', String(!expanded));
          if(submenu){
            submenu.classList.toggle('show', !expanded);
          }
        });
      });
      document.querySelectorAll('.nav-links a').forEach(function(link){
        link.addEventListener('click', function(){
          navLinks.classList.remove('show');
          submenuToggles.forEach(function(toggle){
            toggle.setAttribute('aria-expanded', 'false');
            const parentItem = toggle.closest('.has-submenu');
            const submenu = parentItem ? parentItem.querySelector('.submenu') : null;
            if(submenu){
              submenu.classList.remove('show');
            }
          });
        });
      });
    });
  </script>
</body>
</html>
